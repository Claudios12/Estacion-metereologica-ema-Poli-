# Proxy inverso con HTTPS delante de Poli Clima (Linux). Sustituye clima.ejemplo.edu.co por el dominio real
# y las rutas de los certificados por los del Politécnico (o los de Let's Encrypt).
# Con este proxy delante, en la configuración de Poli Clima: HOST=127.0.0.1 y TRUST_PROXY=true.
server {
    listen 80;
    server_name clima.ejemplo.edu.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name clima.ejemplo.edu.co;

    ssl_certificate     /etc/ssl/certs/clima.ejemplo.edu.co.pem;
    ssl_certificate_key /etc/ssl/private/clima.ejemplo.edu.co.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # La clave del analista y del administrador la exige Poli Clima (HTTP básica, que viaja protegida por este HTTPS).
    # Capa extra OPCIONAL: limitar además esas rutas a la red del Politécnico (descomente y ajuste las redes).
    # location ~ ^/api/(historico|status) {
    #     allow 127.0.0.1;
    #     allow 10.0.0.0/8;      # red interna del Politécnico (ejemplo)
    #     deny  all;
    #     proxy_pass         http://127.0.0.1:8080;
    #     proxy_set_header   X-Forwarded-For $remote_addr;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        # Poli Clima toma de X-Forwarded-For la IP más a la derecha (la que agrega este proxy) solo si TRUST_PROXY=true.
        # Aquí se sobrescribe con la IP que ve Nginx, que es lo más simple y seguro con un solo proxy delante.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }
}
